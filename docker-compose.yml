name: cpd-crime-insights

services:
  warehouse:
    image: postgres:16
    container_name: cpd_warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "127.0.0.1:5433:5432"   # loopback only: never reachable from the internet (Python on the same host still can)
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    networks:
      - cpd_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mb_appdb:
    image: postgres:16
    container_name: cpd_mb_appdb
    environment:
      POSTGRES_USER: ${MB_APPDB_USER}
      POSTGRES_PASSWORD: ${MB_APPDB_PASSWORD}
      POSTGRES_DB: ${MB_APPDB_NAME}
    volumes:
      - mb_appdb_data:/var/lib/postgresql/data
    networks:
      - cpd_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: cpd_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: mb_appdb
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_APPDB_NAME}
      MB_DB_USER: ${MB_APPDB_USER}
      MB_DB_PASS: ${MB_APPDB_PASSWORD}
      JAVA_OPTS: "-Xmx1g"   # cap the JVM heap so everything fits on a 2 GB server
    depends_on:
      mb_appdb:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    networks:
      - cpd_net
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

networks:
  cpd_net:
    driver: bridge

volumes:
  warehouse_data:
  mb_appdb_data:
